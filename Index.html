
<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="utf-8" />
        <title>Cleb</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

        <link href="Cleb.css" rel="stylesheet" type="text/css" />
        <script src="Cleb.js" type="text/javascript"></script>


    </head>
    <style>
            .gradientcolor {
                background-size: 400% 400%;

                animation: gradient 15s ease infinite;
                margin: 0;
                padding: 0;
            }


            @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
    </style>
    <body>






        <div id="Template_Tile" style="display: none;">
            <div class="tileouter" id="Tile_$ID$">
                <div class="tileinner">
                    <div class="title">
                        <span>$TITLE$</span>
                    </div>
                    <div class="dataouter">
                        <div class="valueouter left" id="Value1_$ID$">
                            <span>$VALUE1$</span>
                        </div>
                    </div>
                    <div class="dataouter">
                        <div class=" valueouter right" id="Value2_$ID$" >
                            <span>$VALUE2$</span>
                        </div>
                    </div>
                    <div class="title">
                        <span>$TOTAL$</span>
                    </div>
                </div>
            </div>
        </div>

        


    </body>
</html>
